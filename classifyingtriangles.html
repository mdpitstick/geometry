<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classifying Triangles</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f4f7fb;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin:20px 0;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.flashcard{
    background:#d7e8ff;
    padding:20px;
    cursor:pointer;
    border-radius:10px;
    margin:10px 0;
}

.correct{
    color:green;
    font-weight:bold;
}
</style>

</head>
<body>

<h1>🔺 Classifying Triangles</h1>

<div class="card">
<h2>Learning Target</h2>
<p>I can classify triangles by sides and angles.</p>
</div>

<div class="card">
<h2>Flashcard</h2>

<div class="flashcard" onclick="flipCard()">
<span id="cardText">Equilateral</span>
</div>

</div>

<div class="card">

<h2>Practice Question</h2>

<p>
A triangle has side lengths 8, 8, and 11.
</p>

<select id="answer">
<option></option>
<option>Equilateral</option>
<option>Isosceles</option>
<option>Scalene</option>
</select>

<button onclick="checkAnswer()">Check</button>

<p id="result"></p>

</div>

<script>

let flipped=false;

function flipCard(){

const card=document.getElementById("cardText");

if(!flipped){
card.innerHTML="3 congruent sides";
flipped=true;
}
else{
card.innerHTML="Equilateral";
flipped=false;
}

}

function checkAnswer(){

const answer=
document.getElementById("answer").value;

if(answer==="Isosceles"){
document.getElementById("result").innerHTML=
"<span class='correct'>✅ Correct!</span>";
}
else{
document.getElementById("result").innerHTML=
"❌ Try Again";
}

}

</script>

</body>
</html>
